# Helfer für die Farbwähler des Neumorphism-Themes
# Speichern Primär- und Akzentfarbe als #rrggbb. Leer = Farbe aus dem Theme.
#
# Einbinden über Packages (configuration.yaml):
#   homeassistant:
#     packages: !include_dir_named packages
# Alternativ: Einstellungen → Geräte & Dienste → Helfer → Text, mit genau diesen Entitäts-IDs.

input_text:
  neumorphism_primaerfarbe:
    name: Neumorphism Primärfarbe
    icon: mdi:palette
    min: 0
    max: 7
    pattern: "^(#[0-9a-fA-F]{6})?$"
  neumorphism_akzentfarbe:
    name: Neumorphism Akzentfarbe
    icon: mdi:palette-outline
    min: 0
    max: 7
    pattern: "^(#[0-9a-fA-F]{6})?$"
