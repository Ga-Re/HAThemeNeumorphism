set_style:
  fields:
    primary_color:
      required: false
      selector:
        color_rgb:
    accent_color:
      required: false
      selector:
        color_rgb:
    background:
      required: false
      selector:
        select:
          translation_key: background
          options:
            - standard
            - gray
            - warm
            - sand
            - mint
            - rose
            - blue
            - primary
    strength:
      required: false
      selector:
        number:
          min: -100
          max: 100
          step: 5
          mode: slider
    light_direction:
      required: false
      selector:
        select:
          translation_key: light_direction
          options:
            - top_left
            - top
            - top_right
            - sun
    surface:
      required: false
      selector:
        select:
          translation_key: surface
          options:
            - flat
            - convex
            - concave
    contrast:
      required: false
      selector:
        select:
          translation_key: contrast
          options:
            - normal
            - high
    roundness:
      required: false
      selector:
        number:
          min: 0
          max: 200
          step: 10
          unit_of_measurement: "%"
          mode: slider
    font:
      required: false
      selector:
        select:
          translation_key: font
          options:
            - standard
            - round
            - modern
            - legible
    font_size:
      required: false
      selector:
        number:
          min: 85
          max: 130
          step: 5
          unit_of_measurement: "%"
          mode: slider
    density:
      required: false
      selector:
        select:
          translation_key: density
          options:
            - compact
            - normal
            - airy
    sections:
      required: false
      selector:
        select:
          translation_key: sections
          options:
            - open
            - well
            - raised
    pressed:
      required: false
      selector:
        boolean:
    emboss:
      required: false
      selector:
        boolean:
    grain:
      required: false
      selector:
        select:
          translation_key: grain
          options:
            - off
            - fine
            - strong
    charts:
      required: false
      selector:
        select:
          translation_key: charts
          options:
            - theme
            - standard
    animations:
      required: false
      selector:
        boolean:
    glow:
      required: false
      selector:
        boolean:
    evening:
      required: false
      selector:
        select:
          multiple: true
          translation_key: evening
          options:
            - warm
            - flat
            - dark
    custom_cards:
      required: false
      selector:
        select:
          translation_key: custom_cards
          options:
            - full
            - frame
            - off
    addons:
      required: false
      selector:
        select:
          translation_key: addons
          options:
            - full
            - off
reset_style:
  fields:
    settings:
      required: false
      selector:
        select:
          multiple: true
          translation_key: settings
          options:
            - primary_color
            - accent_color
            - background
            - strength
            - light_direction
            - surface
            - contrast
            - roundness
            - font
            - font_size
            - density
            - sections
            - pressed
            - emboss
            - grain
            - charts
            - animations
            - glow
            - evening
            - custom_cards
            - addons
