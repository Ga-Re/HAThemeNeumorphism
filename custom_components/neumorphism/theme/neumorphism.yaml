# Neumorphism-Theme für Home Assistant (Hell- und Dunkelmodus)
# Erzeugt mit generate.py. Änderungen dort vornehmen und die Datei neu erzeugen.

"Neumorphism":
  primary-color: "#3d7bfd"
  accent-color: "#ff8a3d"
  light-primary-color: "#bfd5ff"
  dark-primary-color: "#1b54d0"
  darker-primary-color: "#00309d"
  text-primary-color: "#ffffff"
  text-light-primary-color: "#212121"
  text-accent-color: "#212121"
  state-icon-color: "var(--primary-color)"
  mdc-theme-secondary: "var(--accent-color)"
  mdc-checkbox-checked-color: "var(--accent-color)"
  switch-checked-color: "var(--accent-color)"
  switch-checked-button-color: "var(--accent-color)"
  switch-checked-track-color: "var(--accent-color)"
  ha-color-on-primary-loud: "#ffffff"
  ha-color-primary-05: "#00000b"
  ha-color-primary-10: "#000221"
  ha-color-primary-20: "#00175a"
  ha-color-primary-30: "#00309d"
  ha-color-primary-40: "#1b54d0"
  ha-color-primary-50: "#3d7bfd"
  ha-color-primary-60: "#699bff"
  ha-color-primary-70: "#94b9ff"
  ha-color-primary-80: "#bfd5ff"
  ha-color-primary-90: "#eaf1ff"
  ha-color-primary-95: "#ffffff"
  modes:
    light:
      # Grundwerte (der Hintergrund-Farbton im Profil ersetzt sie)
      neumorphism-shadow-dark-rgb: "163, 174, 194"
      neumorphism-shadow-dark-alpha: "0.65"
      neumorphism-shadow-light-rgb: "255, 255, 255"
      neumorphism-shadow-light-alpha: "0.95"
      neumorphism-track: "#d5dbe4"
      neumorphism-thumb: "#f2f4f8"
      neumorphism-sheen: "rgba(var(--neumorphism-shadow-light-rgb), 0.6)"
      neumorphism-shade: "rgba(var(--neumorphism-shadow-dark-rgb), 0.4)"
      # Flächen
      primary-background-color: "#e4e8ef"
      secondary-background-color: "#dce1e9"
      clear-background-color: "var(--primary-background-color)"
      card-background-color: "#e4e8ef"
      ha-card-background: "var(--card-background-color)"
      ha-color-surface-default: "var(--card-background-color)"
      ha-color-surface-low: "var(--card-background-color)"
      ha-color-surface-lower: "var(--secondary-background-color)"
      # Schrift
      primary-text-color: "#3d4657"
      secondary-text-color: "#7a8496"
      disabled-text-color: "#a8b0be"
      rgb-primary-text-color: "61, 70, 87"
      ha-card-header-color: "var(--primary-text-color)"
