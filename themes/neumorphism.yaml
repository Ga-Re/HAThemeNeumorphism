      # Schrift
      primary-text-color: "#e4e8f1"
      secondary-text-color: "#9aa4b8"
      disabled-text-color: "#5c6578"
      rgb-primary-text-color: "228, 232, 241"
      ha-card-header-color: "var(--primary-text-color)"
      # Karten: weicher Schatten unten rechts, heller Schein oben links
      ha-card-box-shadow: "12px 12px 32px rgba(0, 0, 0, 0.55), -12px -12px 32px rgba(150, 166, 204, 0.14)"
      ha-card-border-width: "1px"
      ha-card-border-color: "rgba(255, 255, 255, 0.03)"
      ha-card-border-radius: "28px"
      ha-box-shadow-s: "4px 4px 10px rgba(0, 0, 0, 0.55), -4px -4px 10px rgba(150, 166, 204, 0.14)"
      ha-box-shadow-m: "8px 8px 20px rgba(0, 0, 0, 0.55), -8px -8px 20px rgba(150, 166, 204, 0.14)"
      ha-box-shadow-l: "14px 14px 36px rgba(0, 0, 0, 0.55), -14px -14px 36px rgba(150, 166, 204, 0.14)"
      bar-box-shadow: "6px 6px 16px rgba(0, 0, 0, 0.55), -6px -6px 16px rgba(150, 166, 204, 0.14)"
      shadow-color: "rgba(0, 0, 0, 0.55)"
      neumorphism-inset-shadow: "inset 5px 5px 12px rgba(0, 0, 0, 0.55), inset -5px -5px 12px rgba(150, 166, 204, 0.14)"
      divider-color: "rgba(228, 232, 241, 0.08)"
      outline-color: "rgba(228, 232, 241, 0.08)"
      outline-hover-color: "rgba(228, 232, 241, 0.16)"
      # Kopfzeile und Seitenleiste verschmelzen mit dem Hintergrund
      app-header-background-color: "var(--primary-background-color)"
      app-header-text-color: "var(--primary-text-color)"
      app-header-border-bottom: "none"
      sidebar-background-color: "var(--primary-background-color)"
      sidebar-text-color: "var(--primary-text-color)"
      sidebar-icon-color: "var(--secondary-text-color)"
      sidebar-selected-text-color: "var(--primary-color)"
      sidebar-selected-icon-color: "var(--primary-color)"
      # Dialoge
      ha-dialog-surface-background: "var(--card-background-color)"
      ha-dialog-border-radius: "32px"
      dialog-box-shadow: "18px 18px 48px rgba(0, 0, 0, 0.55), -18px -18px 48px rgba(150, 166, 204, 0.14)"
      mdc-dialog-scrim-color: "rgba(10, 12, 16, 0.55)"
      ha-dialog-scrim-backdrop-filter: "blur(6px)"
      # Eingabefelder wirken eingelassen
      ha-color-form-background: "#22262e"
      ha-color-form-background-hover: "#22262e"
      ha-color-form-background-disabled: "#20242c"
      ha-color-border-neutral-loud: "rgba(228, 232, 241, 0.18)"
