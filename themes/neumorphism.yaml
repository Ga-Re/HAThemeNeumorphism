# Neumorphism-Theme für Home Assistant (Hell- und Dunkelmodus)
# Erzeugt mit generate.py. Änderungen am besten dort vornehmen
# und die Datei neu erzeugen.
#
# Der Modus (hell/dunkel/automatisch) wird im Benutzerprofil eingestellt.

"Neumorphism Blau + Orange":
  primary-color: "#3d7bfd"
  accent-color: "#ff8a3d"
  light-primary-color: "#afd5ff"
  dark-primary-color: "#1b54d0"
  darker-primary-color: "#002ca4"
  text-primary-color: "#ffffff"
  text-light-primary-color: "#212121"
  text-accent-color: "#212121"
  state-icon-color: "var(--primary-color)"
  mdc-theme-secondary: "var(--accent-color)"
  mdc-checkbox-checked-color: "var(--accent-color)"
  switch-checked-color: "var(--accent-color)"
  switch-checked-button-color: "var(--accent-color)"
  switch-checked-track-color: "var(--accent-color)"
  ha-color-on-primary-loud: "#ffffff"
  ha-color-primary-05: "#0f003d"
  ha-color-primary-10: "#0e0051"
  ha-color-primary-20: "#00007a"
  ha-color-primary-30: "#002ca4"
  ha-color-primary-40: "#1b54d0"
  ha-color-primary-50: "#3d7bfd"
  ha-color-primary-60: "#639aff"
  ha-color-primary-70: "#88b8ff"
  ha-color-primary-80: "#afd5ff"
  ha-color-primary-90: "#d6f2ff"
  ha-color-primary-95: "#e9ffff"
  modes: &neumorphism_modes
    light:
      # Flächen
      primary-background-color: "#e4e9f0"
      secondary-background-color: "#d9dfe8"
      clear-background-color: "#e4e9f0"
      card-background-color: "#e4e9f0"
      ha-card-background: "var(--card-background-color)"
      ha-color-surface-default: "#e4e9f0"
      ha-color-surface-low: "#e4e9f0"
      ha-color-surface-lower: "#d9dfe8"
      # Schrift
      primary-text-color: "#2f3a4a"
      secondary-text-color: "#6b7789"
      disabled-text-color: "#a3adbb"
      rgb-primary-text-color: "47, 58, 74"
      ha-card-header-color: "var(--primary-text-color)"
      # Karten: gleiche Farbe wie der Hintergrund, nur Schatten
      ha-card-box-shadow: "8px 8px 16px rgba(163, 177, 198, 0.60), -8px -8px 16px rgba(255, 255, 255, 0.90)"
      ha-card-border-width: "0px"
      ha-card-border-color: "transparent"
      ha-card-border-radius: "22px"
      ha-box-shadow-s: "3px 3px 6px rgba(163, 177, 198, 0.60), -3px -3px 6px rgba(255, 255, 255, 0.90)"
      ha-box-shadow-m: "6px 6px 12px rgba(163, 177, 198, 0.60), -6px -6px 12px rgba(255, 255, 255, 0.90)"
      ha-box-shadow-l: "12px 12px 24px rgba(163, 177, 198, 0.60), -12px -12px 24px rgba(255, 255, 255, 0.90)"
      bar-box-shadow: "4px 4px 10px rgba(163, 177, 198, 0.60), -4px -4px 10px rgba(255, 255, 255, 0.90)"
      shadow-color: "rgba(163, 177, 198, 0.60)"
      neumorphism-inset-shadow: "inset 3px 3px 6px rgba(163, 177, 198, 0.60), inset -3px -3px 6px rgba(255, 255, 255, 0.90)"
      divider-color: "rgba(47, 58, 74, 0.08)"
      outline-color: "rgba(47, 58, 74, 0.08)"
      outline-hover-color: "rgba(47, 58, 74, 0.16)"
      # Kopfzeile und Seitenleiste verschmelzen mit dem Hintergrund
      app-header-background-color: "var(--primary-background-color)"
      app-header-text-color: "var(--primary-text-color)"
      app-header-border-bottom: "none"
      sidebar-background-color: "var(--primary-background-color)"
      sidebar-text-color: "var(--primary-text-color)"
      sidebar-icon-color: "var(--secondary-text-color)"
      sidebar-selected-text-color: "var(--primary-color)"
      sidebar-selected-icon-color: "var(--primary-color)"
      # Dialoge
      ha-dialog-surface-background: "var(--card-background-color)"
      ha-dialog-border-radius: "28px"
      dialog-box-shadow: "14px 14px 28px rgba(163, 177, 198, 0.60), -14px -14px 28px rgba(255, 255, 255, 0.90)"
      mdc-dialog-scrim-color: "rgba(228, 233, 240, 0.55)"
      ha-dialog-scrim-backdrop-filter: "blur(6px)"
      # Eingabefelder wirken eingelassen
      input-fill-color: "#d9dfe8"
      input-disabled-fill-color: "#e4e9f0"
      input-ink-color: "var(--primary-text-color)"
      input-label-ink-color: "var(--secondary-text-color)"
      input-idle-line-color: "transparent"
      input-hover-line-color: "rgba(47, 58, 74, 0.2)"
      input-outlined-idle-border-color: "rgba(47, 58, 74, 0.12)"
      input-outlined-hover-border-color: "rgba(47, 58, 74, 0.3)"
      input-dropdown-icon-color: "var(--secondary-text-color)"
      # Schalter und Regler
      ha-switch-background-color: "#cdd5e0"
      ha-switch-thumb-background-color: "#f5f7fa"
      ha-switch-checked-background-color: "var(--accent-color)"
      ha-switch-checked-thumb-background-color: "#f5f7fa"
      ha-switch-thumb-box-shadow: "2px 2px 4px rgba(163, 177, 198, 0.60), -2px -2px 4px rgba(255, 255, 255, 0.90)"
      switch-unchecked-track-color: "#cdd5e0"
      switch-unchecked-button-color: "#f5f7fa"
      slider-track-color: "#cdd5e0"
      scrollbar-thumb-color: "#cdd5e0"
      # Tabellen, Code, Badges
      table-header-background-color: "var(--primary-background-color)"
      table-row-background-color: "var(--primary-background-color)"
      table-row-alternative-background-color: "var(--secondary-background-color)"
      data-table-background-color: "var(--card-background-color)"
      markdown-code-background-color: "var(--secondary-background-color)"
      code-editor-background-color: "var(--secondary-background-color)"
      label-badge-background-color: "var(--card-background-color)"
      ha-assist-chip-filled-container-color: "#d9dfe8"
      chip-background-color: "#d9dfe8"
    dark:
      # Flächen
      primary-background-color: "#272b33"
      secondary-background-color: "#2f343d"
      clear-background-color: "#272b33"
      card-background-color: "#272b33"
      ha-card-background: "var(--card-background-color)"
      ha-color-surface-default: "#272b33"
      ha-color-surface-low: "#272b33"
      ha-color-surface-lower: "#2f343d"
      # Schrift
      primary-text-color: "#e3e7ee"
      secondary-text-color: "#9aa3b2"
      disabled-text-color: "#5d6573"
      rgb-primary-text-color: "227, 231, 238"
      ha-card-header-color: "var(--primary-text-color)"
      # Karten: gleiche Farbe wie der Hintergrund, nur Schatten
      ha-card-box-shadow: "8px 8px 16px rgba(0, 0, 0, 0.50), -8px -8px 16px rgba(255, 255, 255, 0.05)"
      ha-card-border-width: "0px"
      ha-card-border-color: "transparent"
      ha-card-border-radius: "22px"
      ha-box-shadow-s: "3px 3px 6px rgba(0, 0, 0, 0.50), -3px -3px 6px rgba(255, 255, 255, 0.05)"
      ha-box-shadow-m: "6px 6px 12px rgba(0, 0, 0, 0.50), -6px -6px 12px rgba(255, 255, 255, 0.05)"
      ha-box-shadow-l: "12px 12px 24px rgba(0, 0, 0, 0.50), -12px -12px 24px rgba(255, 255, 255, 0.05)"
      bar-box-shadow: "4px 4px 10px rgba(0, 0, 0, 0.50), -4px -4px 10px rgba(255, 255, 255, 0.05)"
      shadow-color: "rgba(0, 0, 0, 0.50)"
      neumorphism-inset-shadow: "inset 3px 3px 6px rgba(0, 0, 0, 0.50), inset -3px -3px 6px rgba(255, 255, 255, 0.05)"
      divider-color: "rgba(227, 231, 238, 0.08)"
      outline-color: "rgba(227, 231, 238, 0.08)"
      outline-hover-color: "rgba(227, 231, 238, 0.16)"
      # Kopfzeile und Seitenleiste verschmelzen mit dem Hintergrund
      app-header-background-color: "var(--primary-background-color)"
      app-header-text-color: "var(--primary-text-color)"
      app-header-border-bottom: "none"
      sidebar-background-color: "var(--primary-background-color)"
      sidebar-text-color: "var(--primary-text-color)"
      sidebar-icon-color: "var(--secondary-text-color)"
      sidebar-selected-text-color: "var(--primary-color)"
      sidebar-selected-icon-color: "var(--primary-color)"
      # Dialoge
      ha-dialog-surface-background: "var(--card-background-color)"
      ha-dialog-border-radius: "28px"
      dialog-box-shadow: "14px 14px 28px rgba(0, 0, 0, 0.50), -14px -14px 28px rgba(255, 255, 255, 0.05)"
      mdc-dialog-scrim-color: "rgba(15, 17, 21, 0.55)"
      ha-dialog-scrim-backdrop-filter: "blur(6px)"
      # Eingabefelder wirken eingelassen
      input-fill-color: "#2f343d"
      input-disabled-fill-color: "#272b33"
      input-ink-color: "var(--primary-text-color)"
      input-label-ink-color: "var(--secondary-text-color)"
      input-idle-line-color: "transparent"
      input-hover-line-color: "rgba(227, 231, 238, 0.2)"
      input-outlined-idle-border-color: "rgba(227, 231, 238, 0.12)"
      input-outlined-hover-border-color: "rgba(227, 231, 238, 0.3)"
      input-dropdown-icon-color: "var(--secondary-text-color)"
      # Schalter und Regler
      ha-switch-background-color: "#1f2228"
      ha-switch-thumb-background-color: "#3a404a"
      ha-switch-checked-background-color: "var(--accent-color)"
      ha-switch-checked-thumb-background-color: "#3a404a"
      ha-switch-thumb-box-shadow: "2px 2px 4px rgba(0, 0, 0, 0.50), -2px -2px 4px rgba(255, 255, 255, 0.05)"
      switch-unchecked-track-color: "#1f2228"
      switch-unchecked-button-color: "#3a404a"
      slider-track-color: "#1f2228"
      scrollbar-thumb-color: "#1f2228"
      # Tabellen, Code, Badges
      table-header-background-color: "var(--primary-background-color)"
      table-row-background-color: "var(--primary-background-color)"
      table-row-alternative-background-color: "var(--secondary-background-color)"
      data-table-background-color: "var(--card-background-color)"
      markdown-code-background-color: "var(--secondary-background-color)"
      code-editor-background-color: "var(--secondary-background-color)"
      label-badge-background-color: "var(--card-background-color)"
      ha-assist-chip-filled-container-color: "#2f343d"
      chip-background-color: "#2f343d"

