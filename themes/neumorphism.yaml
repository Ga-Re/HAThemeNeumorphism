      input-idle-line-color: "transparent"
      input-hover-line-color: "rgba(228, 232, 241, 0.2)"
      input-outlined-idle-border-color: "rgba(228, 232, 241, 0.12)"
      input-outlined-hover-border-color: "rgba(228, 232, 241, 0.3)"
      input-dropdown-icon-color: "var(--secondary-text-color)"
      # Schalter und Regler
      ha-switch-background-color: "#1a1d23"
      ha-switch-thumb-background-color: "#3b4251"
      ha-switch-checked-background-color: "var(--accent-color)"
      ha-switch-checked-thumb-background-color: "#3b4251"
      ha-switch-thumb-box-shadow: "2px 2px 5px rgba(0, 0, 0, 0.55), -2px -2px 5px rgba(150, 166, 204, 0.14)"
