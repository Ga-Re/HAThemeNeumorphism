# Neumorphism-Theme für Home Assistant (Hell- und Dunkelmodus)
# Erzeugt mit generate.py. Änderungen am besten dort vornehmen
# und die Datei neu erzeugen.
#
# Der Modus (hell/dunkel/automatisch) wird im Benutzerprofil eingestellt.
# Effektstärke: normal

"Neumorphism":
  primary-color: "#3d7bfd"
  accent-color: "#ff8a3d"
  light-primary-color: "#afd5ff"
  dark-primary-color: "#1b54d0"
  darker-primary-color: "#002ca4"
  text-primary-color: "#ffffff"
  text-light-primary-color: "#212121"
  text-accent-color: "#212121"
  state-icon-color: "var(--primary-color)"
  mdc-theme-secondary: "var(--accent-color)"
  mdc-checkbox-checked-color: "var(--accent-color)"
  switch-checked-color: "var(--accent-color)"
  switch-checked-button-color: "var(--accent-color)"
  switch-checked-track-color: "var(--accent-color)"
  ha-color-on-primary-loud: "#ffffff"
  ha-color-primary-05: "#0f003d"
  ha-color-primary-10: "#0e0051"
  ha-color-primary-20: "#00007a"
  ha-color-primary-30: "#002ca4"
  ha-color-primary-40: "#1b54d0"
  ha-color-primary-50: "#3d7bfd"
  ha-color-primary-60: "#639aff"
  ha-color-primary-70: "#88b8ff"
  ha-color-primary-80: "#afd5ff"
  ha-color-primary-90: "#d6f2ff"
  ha-color-primary-95: "#e9ffff"
  modes: &neumorphism_modes
    light:
      # Flächen
      primary-background-color: "#d9e2f4"
      secondary-background-color: "#d2dcf0"
      clear-background-color: "#d9e2f4"
      card-background-color: "#e6ecf9"
      ha-card-background: "var(--card-background-color)"
      ha-color-surface-default: "#e6ecf9"
      ha-color-surface-low: "#d9e2f4"
      ha-color-surface-lower: "#d2dcf0"
      # Schrift
      primary-text-color: "#3f4a63"
      secondary-text-color: "#7d88a3"
      disabled-text-color: "#a9b3c9"
      rgb-primary-text-color: "63, 74, 99"
      ha-card-header-color: "var(--primary-text-color)"
      # Karten: weicher Schatten unten rechts, heller Schein oben links
      ha-card-box-shadow: "12px 12px 32px rgba(143, 160, 201, 0.50), -12px -12px 32px rgba(255, 255, 255, 0.85)"
      ha-card-border-width: "0px"
      ha-card-border-color: "transparent"
      ha-card-border-radius: "28px"
      ha-box-shadow-s: "4px 4px 10px rgba(143, 160, 201, 0.50), -4px -4px 10px rgba(255, 255, 255, 0.85)"
      ha-box-shadow-m: "8px 8px 20px rgba(143, 160, 201, 0.50), -8px -8px 20px rgba(255, 255, 255, 0.85)"
      ha-box-shadow-l: "14px 14px 36px rgba(143, 160, 201, 0.50), -14px -14px 36px rgba(255, 255, 255, 0.85)"
      bar-box-shadow: "6px 6px 16px rgba(143, 160, 201, 0.50), -6px -6px 16px rgba(255, 255, 255, 0.85)"
      shadow-color: "rgba(143, 160, 201, 0.50)"
      neumorphism-inset-shadow: "inset 5px 5px 12px rgba(143, 160, 201, 0.50), inset -5px -5px 12px rgba(255, 255, 255, 0.85)"
      divider-color: "rgba(63, 74, 99, 0.08)"
      outline-color: "rgba(63, 74, 99, 0.08)"
      outline-hover-color: "rgba(63, 74, 99, 0.16)"
      # Kopfzeile und Seitenleiste verschmelzen mit dem Hintergrund
      app-header-background-color: "var(--primary-background-color)"
      app-header-text-color: "var(--primary-text-color)"
      app-header-border-bottom: "none"
      sidebar-background-color: "var(--primary-background-color)"
      sidebar-text-color: "var(--primary-text-color)"
      sidebar-icon-color: "var(--secondary-text-color)"
      sidebar-selected-text-color: "var(--primary-color)"
      sidebar-selected-icon-color: "var(--primary-color)"
      # Dialoge
      ha-dialog-surface-background: "var(--card-background-color)"
      ha-dialog-border-radius: "32px"
      dialog-box-shadow: "18px 18px 48px rgba(143, 160, 201, 0.50), -18px -18px 48px rgba(255, 255, 255, 0.85)"
      mdc-dialog-scrim-color: "rgba(217, 226, 244, 0.55)"
      ha-dialog-scrim-backdrop-filter: "blur(6px)"
      # Eingabefelder wirken eingelassen
      ha-color-form-background: "#d2dcf0"
      ha-color-form-background-hover: "#d2dcf0"
      ha-color-form-background-disabled: "#d9e2f4"
      ha-color-border-neutral-loud: "rgba(63, 74, 99, 0.18)"
      ha-color-border-neutral-normal: "rgba(63, 74, 99, 0.14)"
      ha-color-border-neutral-quiet: "rgba(63, 74, 99, 0.08)"
      input-fill-color: "#d2dcf0"
      input-disabled-fill-color: "#d9e2f4"
      input-ink-color: "var(--primary-text-color)"
      input-label-ink-color: "var(--secondary-text-color)"
      input-idle-line-color: "transparent"
      input-hover-line-color: "rgba(63, 74, 99, 0.2)"
      input-outlined-idle-border-color: "rgba(63, 74, 99, 0.12)"
      input-outlined-hover-border-color: "rgba(63, 74, 99, 0.3)"
      input-dropdown-icon-color: "var(--secondary-text-color)"
      # Schalter und Regler
      ha-switch-background-color: "#cbd5ea"
      ha-switch-thumb-background-color: "#f3f6fd"
      ha-switch-checked-background-color: "var(--accent-color)"
      ha-switch-checked-thumb-background-color: "#f3f6fd"
      ha-switch-thumb-box-shadow: "2px 2px 5px rgba(143, 160, 201, 0.50), -2px -2px 5px rgba(255, 255, 255, 0.85)"
      switch-unchecked-track-color: "#cbd5ea"
      switch-unchecked-button-color: "#f3f6fd"
      slider-track-color: "#cbd5ea"
      scrollbar-thumb-color: "#cbd5ea"
      # Tabellen, Code, Badges
      table-header-background-color: "var(--card-background-color)"
      table-row-background-color: "var(--card-background-color)"
      table-row-alternative-background-color: "var(--secondary-background-color)"
      data-table-background-color: "var(--card-background-color)"
      markdown-code-background-color: "var(--secondary-background-color)"
      code-editor-background-color: "var(--secondary-background-color)"
      label-badge-background-color: "var(--card-background-color)"
      ha-assist-chip-filled-container-color: "#d2dcf0"
      chip-background-color: "#d2dcf0"
    dark:
      # Flächen
      primary-background-color: "#20242c"
      secondary-background-color: "#22262e"
      clear-background-color: "#20242c"
      card-background-color: "#282d37"
      ha-card-background: "var(--card-background-color)"
      ha-color-surface-default: "#282d37"
      ha-color-surface-low: "#20242c"
